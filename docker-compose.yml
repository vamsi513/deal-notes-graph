# One command local run: `docker compose up`.
#
# Brings up PostgreSQL and the GraphQL API. The API creates its tables and loads the 30
# authored notes on first start, so there is nothing else to run.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: deal_notes
      POSTGRES_PASSWORD: deal_notes
      POSTGRES_DB: deal_notes
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U deal_notes -d deal_notes']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgres://deal_notes:deal_notes@db:5432/deal_notes
      API_PORT: '4000'
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
